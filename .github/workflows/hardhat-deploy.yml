name: hardhat-deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Legacy SolarPunkCoin deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require deployment secrets
        env:
          POLYGON_MUMBAI_RPC: ${{ secrets.POLYGON_MUMBAI_RPC }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          test -n "$POLYGON_MUMBAI_RPC" || (echo "::error::POLYGON_MUMBAI_RPC is required" && exit 1)
          test -n "$PRIVATE_KEY" || (echo "::error::PRIVATE_KEY is required" && exit 1)

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Deploy legacy contract
        env:
          POLYGON_MUMBAI_RPC: ${{ secrets.POLYGON_MUMBAI_RPC }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          npx hardhat compile
          npx hardhat run scripts/deploy.js --network mumbai
