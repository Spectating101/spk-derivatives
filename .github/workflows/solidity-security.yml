name: solidity-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slither:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: .
          solc-version: 0.8.20
          node-version: 20
          slither-args: "--filter-paths node_modules"
          fail-on: medium
